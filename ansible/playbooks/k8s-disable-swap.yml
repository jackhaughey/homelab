# kubernetes-disable-swap.yml
---
- name: Disable swap on Kubernetes nodes
  hosts: kubernetes
  become: true

  tasks:

    - name: Disable swap immediately
      command: swapoff -a

    - name: Remove swap from fstab
      replace:
        path: /etc/fstab
        regexp: '^(.*swap.*)$'
        replace: '# \1'
